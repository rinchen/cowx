name: Update Weather

on:
  schedule:
    # Two staggered schedules — GitHub often delays or drops a single cron for
    # 1–3h; a second expression improves delivery odds. decide skips when live
    # CDN meta is still fresh (< 40m). The externally-woken check-stale-data.yml
    # self-heals if GitHub delays both schedules.
    - cron: '5,25,45 * * * *'
    - cron: '15,35,55 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write # re-run transient Pages deploy failures in the Verify step
  deployments: write # clear wedged github-pages deployment locks before re-run

concurrency:
  group: update-weather
  cancel-in-progress: false

env:
  LIVE_META_URL: https://rinchen.github.io/cowx/data/meta.json
  FRESH_MINUTES: '40'

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide skip / deploy-only / fetch
        id: gate
        env:
          LIVE_META_URL: ${{ env.LIVE_META_URL }}
          FRESH_MINUTES: ${{ env.FRESH_MINUTES }}
        run: bash scripts/ci/decide-weather-mode.sh

  fetch:
    needs: decide
    if: needs.decide.outputs.mode == 'fetch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      # Only the weather orchestrator step — not install/commit/push races.
      fetch_failed: ${{ steps.weather_fetch.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch weather data
        id: weather_fetch
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          COTRIP_API_KEY: ${{ secrets.COTRIP_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        # Must use `pnpm run fetch:data` — bare `pnpm fetch` is pnpm's
        # lockfile package-download builtin and never runs the weather orchestrator.
        run: pnpm run fetch:data

      - name: Commit data changes
        # Replay the just-fetched public/data onto tip of main (no JSON rebase).
        run: bash scripts/ci/push-weather-data.sh

  # Commits made with GITHUB_TOKEN do not trigger pages.yml (GitHub recursion
  # guard). Deploy public/ here so scheduled weather updates reach the live site.
  # Also runs in deploy_only mode when main has fresh data but the CDN is stale.
  deploy-pages:
    needs: [decide, fetch]
    if: |
      always() &&
      needs.decide.result == 'success' &&
      needs.decide.outputs.mode != 'skip' &&
      (
        needs.decide.outputs.mode == 'deploy_only' ||
        (
          needs.decide.outputs.mode == 'fetch' &&
          needs.fetch.result == 'success' &&
          needs.fetch.outputs.fetch_failed != 'true'
        )
      )
    runs-on: ubuntu-latest
    # Serialize with pages.yml / preview.yml writers to gh-pages.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Strip weather data from existing PR previews
        run: bash scripts/ci/ensure-slim-pr-previews.sh

      # Always move the tip so deploy_only mode can republish when CDN is stale
      # even if main's public/ tree matches the previous gh-pages payload.
      - name: Stamp deploy identity
        run: printf '%s %s\n' "${{ github.run_id }}" "${{ github.sha }}" > public/.pages-deploy-stamp

      - name: Deploy to gh-pages
        id: pages_deploy
        # Marketplace: github-pages-deploy-action (publishes folder → gh-pages branch)
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          branch: gh-pages
          folder: public
          clean: true
          clean-exclude: pr-preview

      - name: Verify GitHub Pages build
        id: verify_pages
        if: steps.pages_deploy.outputs.deployment_status != 'skipped' && env.deployment_status != 'skipped'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          tip="$(git rev-parse origin/gh-pages)"
          bash scripts/ci/wait-for-pages-build.sh "${tip}"

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: [decide, fetch, deploy-pages]
    # Discord when weather fetch fails OR Pages publish verification fails.
    # Skip when decide chose skip, or install/push races after a successful fetch.
    if: |
      always() && (
        needs.fetch.outputs.fetch_failed == 'true' ||
        needs.deploy-pages.result == 'failure'
      )
    steps:
      - name: Post Discord notification
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          FETCH_FAILED: ${{ needs.fetch.outputs.fetch_failed }}
          DEPLOY_RESULT: ${{ needs.deploy-pages.result }}
        run: |
          if [ -z "$NOTIFY_WEBHOOK_URL" ]; then
            echo "NOTIFY_WEBHOOK_URL not configured, skipping Discord notification"
            exit 0
          fi
          reason="unknown failure"
          if [ "$FETCH_FAILED" = "true" ]; then
            reason="weather fetch failed"
          elif [ "$DEPLOY_RESULT" = "failure" ]; then
            reason="ALERT: gh-pages deploy or Pages build verification failed (branch may be missing)"
          fi
          payload=$(jq -n \
            --arg content "COWX ${reason}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{content: $content}')
          curl --max-time 15 -fsS -X POST -H "Content-Type: application/json" -d "$payload" "$NOTIFY_WEBHOOK_URL"
