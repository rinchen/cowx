name: Check Stale Data

# Watchdog: if production meta.json is older than STALE_MINUTES, dispatch
# Update Weather (self-heal), Discord-alert when configured, and fail the run.
# GitHub often delays */20 schedules by 1–3h; this catch-up path must not be
# alert-only or the CDN stays frozen until a human notices.
on:
  schedule:
    # Frequent lightweight tick — GitHub may delay, but more chances than */2h.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: check-stale-data
  cancel-in-progress: false

env:
  LIVE_META_URL: https://rinchen.github.io/cowx/data/meta.json
  # Recover before the ~2h UX cliff; cron gaps of 90–220m are common.
  STALE_MINUTES: '90'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check live meta age
        id: age
        env:
          LIVE_META_URL: ${{ env.LIVE_META_URL }}
          STALE_MINUTES: ${{ env.STALE_MINUTES }}
        run: bash scripts/ci/check-stale-live-meta.sh
        continue-on-error: true

      - name: Self-heal — dispatch Update Weather
        if: steps.age.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Live meta stale; dispatching update-weather.yml on main"
          gh workflow run update-weather.yml --repo "${{ github.repository }}" --ref main

      - name: Notify Discord if stale
        if: steps.age.outcome == 'failure'
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          GENERATED_AT: ${{ steps.age.outputs.generated_at }}
          AGE_MINUTES: ${{ steps.age.outputs.age_minutes }}
          LIVE_META_URL: ${{ env.LIVE_META_URL }}
          STALE_MINUTES: ${{ env.STALE_MINUTES }}
        run: |
          set -euo pipefail
          if [ -z "${NOTIFY_WEBHOOK_URL}" ]; then
            echo "NOTIFY_WEBHOOK_URL not configured, skipping Discord notification"
          else
            age_label="${AGE_MINUTES:-unknown}"
            generated="${GENERATED_AT:-unknown}"
            content="COWX production weather data stale (${age_label}m ≥ ${STALE_MINUTES}m). Auto-dispatched Update Weather. generatedAt=${generated}. Live: ${LIVE_META_URL}. This check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            payload=$(jq -n --arg content "$content" '{content: $content}')
            curl --max-time 15 -fsS -X POST -H "Content-Type: application/json" -d "$payload" "$NOTIFY_WEBHOOK_URL"
          fi
          # Fail the workflow so Actions shows red even when Discord is unset.
          exit 1
